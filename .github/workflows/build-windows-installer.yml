# Builds the ATLASZ Windows installer (NSIS .exe with desktop icon) on a Windows runner. No secrets, no deploy, no Railway.
# Output is an Actions artifact only. MANUAL ONLY (workflow_dispatch): a push never starts a build; Joci approves each run.
name: build-windows-installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Keep LF line endings (tests hash and split files)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run the real test suite
        run: npm test 2>&1 | Tee-Object -FilePath ../test-output.txt
        working-directory: atlasz-runtime
        shell: pwsh
      - name: Report failing tests as annotations (readable without log access)
        if: failure()
        run: node scripts/gh-annotate-test-failures.mjs test-output.txt
      - name: Stage app
        run: node atlasz-control-center/scripts/stage-win.mjs
      - name: Build installer
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
        working-directory: dist-stage
      - uses: actions/upload-artifact@v4
        with:
          name: ATLASZ-Windows-Installer
          path: dist-stage/release/*.exe
